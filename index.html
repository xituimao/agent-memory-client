<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Memory</title>
  </head>
  <body>
    <main class="app">
      <header class="status-card" id="statusCard">
        <span class="status-dot" id="statusDot"></span>
        <div class="status-text">
          <h1 id="statusTitle">载入中…</h1>
          <p id="statusSub">正在读取配置</p>
        </div>
        <button class="ghost-btn" id="btnViewer" title="在浏览器中打开记忆查看器">查看器</button>
      </header>

      <section class="card">
        <h2>服务器</h2>
        <div class="grid-2">
          <label class="field span-2">
            <span>服务器地址</span>
            <input id="host" type="text" placeholder="your-server-ip" />
          </label>
          <label class="field">
            <span>SSH 端口</span>
            <input id="sshPort" type="number" min="1" max="65535" value="22" />
          </label>
          <label class="field">
            <span>SSH 用户</span>
            <input id="sshUser" type="text" placeholder="root" />
          </label>
          <label class="field span-2">
            <span>SSH 私钥路径<em class="hint">留空则使用默认密钥</em></span>
            <div class="row">
              <input id="sshKeyPath" type="text" placeholder="~/.ssh/id_ed25519" />
              <button class="ghost-btn" id="btnPickKey">浏览…</button>
            </div>
          </label>
        </div>
      </section>

      <section class="card">
        <h2>端口与认证</h2>
        <div class="grid-2">
          <label class="field">
            <span>REST 端口</span>
            <input id="restPort" type="number" min="1" max="65535" value="3111" />
          </label>
          <label class="field">
            <span>Viewer 端口</span>
            <input id="viewerPort" type="number" min="1" max="65535" value="3113" />
          </label>
          <label class="field span-2">
            <span>Bearer Token<em class="hint">服务器上执行 cat ~/.agentmemory/secret 获取</em></span>
            <input id="token" type="password" placeholder="AGENTMEMORY_SECRET" autocomplete="off" />
          </label>
          <label class="field span-2">
            <span>Agent 名称<em class="hint">用于生成 MCP 接入命令</em></span>
            <input id="agentName" type="text" placeholder="claude-code" />
          </label>
        </div>
      </section>

      <details class="card">
        <summary>高级</summary>
        <label class="field">
          <span>附加 SSH 参数<em class="hint">空格分隔，原样追加</em></span>
          <input id="extraSshArgs" type="text" placeholder="如 -J jump@bastion" />
        </label>
      </details>

      <section class="card switches">
        <label class="switch">
          <input id="autoConnect" type="checkbox" />
          <span>启动时自动建立隧道</span>
        </label>
        <label class="switch">
          <input id="autoStart" type="checkbox" />
          <span>登录系统时启动本应用</span>
        </label>
      </section>

      <footer class="actions">
        <button class="secondary" id="btnTest">测试连接</button>
        <button class="secondary" id="btnCopy">复制 MCP 命令</button>
        <button class="primary" id="btnSave">保存并重连</button>
      </footer>
      <p class="toast" id="toast"></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
